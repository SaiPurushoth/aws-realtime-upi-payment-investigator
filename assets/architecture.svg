<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Real-Time UPI Payment Investigator architecture</title>
  <desc id="diagram-description">The real-time path sends synthetic payment events through Kinesis, Managed Service for Apache Flink, an investigation stream, Lambda, and Bedrock AgentCore. The agent reads transaction evidence from DynamoDB and Lambda stores the completed investigation there for the Streamlit dashboard. Independent Kinesis Streaming Tables channels archive both streams to Apache Iceberg tables in Amazon S3 Tables for historical analytics.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .lane-label { font: 700 15px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: 1.2px; }
      .service { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .resource { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #334155; }
      .detail { font: 400 13px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #64748b; }
      .edge-label { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .blue-node { stroke: #60a5fa; }
      .purple-node { stroke: #a78bfa; }
      .green-node { stroke: #34d399; }
      .amber-node { stroke: #fbbf24; }
      .neutral-node { stroke: #cbd5e1; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .flow-purple { fill: none; stroke: #7c3aed; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .flow-green { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .flow-amber { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#arrow-amber); }
      .async { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>

  <text class="title" x="48" y="52">Real-Time UPI Payment Investigator on AWS</text>
  <text class="subtitle" x="48" y="83">Evidence-backed incident detection and investigation with an independent Iceberg history path</text>

  <!-- Real-time lane -->
  <rect x="40" y="112" width="1520" height="438" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="66" y="130" width="258" height="34" rx="17" fill="#dbeafe"/>
  <text class="lane-label" x="86" y="152" fill="#1d4ed8">REAL-TIME OPERATIONAL PATH</text>

  <!-- Primary flow nodes -->
  <rect class="node neutral-node" x="68" y="205" width="205" height="126"/>
  <rect x="68" y="205" width="205" height="9" rx="5" fill="#64748b"/>
  <text class="service" text-anchor="middle" x="170" y="246">Python / Streamlit</text>
  <text class="resource" text-anchor="middle" x="170" y="274">Synthetic producer</text>
  <text class="detail" text-anchor="middle" x="170" y="301">Normal or callback failure</text>

  <rect class="node blue-node" x="315" y="205" width="215" height="126"/>
  <rect x="315" y="205" width="215" height="9" rx="5" fill="#3b82f6"/>
  <text class="service" text-anchor="middle" x="422" y="244">Amazon Kinesis</text>
  <text class="resource" text-anchor="middle" x="422" y="273">upi-payment-events</text>
  <text class="detail" text-anchor="middle" x="422" y="301">Partition: transaction_id</text>

  <rect class="node blue-node" x="575" y="205" width="220" height="126"/>
  <rect x="575" y="205" width="220" height="9" rx="5" fill="#2563eb"/>
  <text class="service" text-anchor="middle" x="685" y="241">Managed Apache Flink</text>
  <text class="resource" text-anchor="middle" x="685" y="270">Stateful correlation</text>
  <text class="detail" text-anchor="middle" x="685" y="296">Detect callback failure</text>
  <text class="detail" text-anchor="middle" x="685" y="315">Suppress duplicates</text>

  <rect class="node blue-node" x="840" y="205" width="215" height="126"/>
  <rect x="840" y="205" width="215" height="9" rx="5" fill="#3b82f6"/>
  <text class="service" text-anchor="middle" x="947" y="244">Amazon Kinesis</text>
  <text class="resource" text-anchor="middle" x="947" y="273">upi-investigations</text>
  <text class="detail" text-anchor="middle" x="947" y="301">One flat incident record</text>

  <rect class="node purple-node" x="1100" y="205" width="195" height="126"/>
  <rect x="1100" y="205" width="195" height="9" rx="5" fill="#8b5cf6"/>
  <text class="service" text-anchor="middle" x="1197" y="244">AWS Lambda</text>
  <text class="resource" text-anchor="middle" x="1197" y="273">Investigator trigger</text>
  <text class="detail" text-anchor="middle" x="1197" y="301">Validate and dispatch</text>

  <rect class="node purple-node" x="1340" y="205" width="190" height="126"/>
  <rect x="1340" y="205" width="190" height="9" rx="5" fill="#7c3aed"/>
  <text class="service" text-anchor="middle" x="1435" y="241">Bedrock AgentCore</text>
  <text class="resource" text-anchor="middle" x="1435" y="270">Strands investigator</text>
  <text class="detail" text-anchor="middle" x="1435" y="296">Bedrock inference</text>
  <text class="detail" text-anchor="middle" x="1435" y="315">Strict JSON result</text>

  <!-- Primary flow arrows -->
  <path class="flow-blue" d="M273 268 H303"/>
  <path class="flow-blue" d="M530 268 H563"/>
  <path class="flow-blue" d="M795 268 H828"/>
  <path class="flow-blue" d="M1055 268 H1088"/>
  <path class="flow-purple" d="M1295 268 H1328"/>

  <!-- Operational store and dashboard -->
  <rect class="node green-node" x="1040" y="397" width="260" height="112"/>
  <rect x="1040" y="397" width="260" height="9" rx="5" fill="#10b981"/>
  <text class="service" text-anchor="middle" x="1170" y="436">Amazon DynamoDB</text>
  <text class="resource" text-anchor="middle" x="1170" y="464">upi-demo-transactions</text>
  <text class="detail" text-anchor="middle" x="1170" y="489">Evidence + investigation result</text>

  <rect class="node neutral-node" x="1340" y="397" width="190" height="112"/>
  <rect x="1340" y="397" width="190" height="9" rx="5" fill="#64748b"/>
  <text class="service" text-anchor="middle" x="1435" y="436">Streamlit</text>
  <text class="resource" text-anchor="middle" x="1435" y="464">Operational dashboard</text>
  <text class="detail" text-anchor="middle" x="1435" y="489">Poll live state</text>

  <path class="flow-green async" d="M170 331 V471 H1028"/>
  <text class="edge-label" x="528" y="462">Write initial transaction evidence</text>

  <path class="flow-purple" d="M1197 331 V385"/>
  <text class="edge-label" x="1208" y="363">Store result</text>

  <path class="flow-purple" d="M1435 331 V360 Q1435 378 1417 378 H1318 Q1300 378 1300 397"/>
  <text class="edge-label" text-anchor="middle" x="1370" y="368">GetItem evidence</text>

  <path class="flow-green" d="M1300 453 H1328"/>
  <text class="edge-label" text-anchor="middle" x="1315" y="442">Read</text>

  <!-- Historical lane -->
  <rect x="40" y="584" width="1520" height="468" rx="24" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <rect x="66" y="602" width="335" height="34" rx="17" fill="#fef3c7"/>
  <text class="lane-label" x="86" y="624" fill="#b45309">ASYNCHRONOUS HISTORICAL PATH</text>
  <text class="detail" x="425" y="624">Independent from live detection and investigation</text>

  <!-- Stream taps -->
  <path class="flow-amber async" d="M422 331 V664"/>
  <text class="edge-label" x="434" y="574">Native stream delivery</text>
  <path class="flow-amber async" d="M947 331 V664"/>
  <text class="edge-label" x="959" y="574">Native stream delivery</text>

  <rect class="node amber-node" x="292" y="676" width="260" height="112"/>
  <rect x="292" y="676" width="260" height="9" rx="5" fill="#f59e0b"/>
  <text class="service" text-anchor="middle" x="422" y="715">Kinesis Streaming Tables</text>
  <text class="resource" text-anchor="middle" x="422" y="743">upi-payment-events-history</text>
  <text class="detail" text-anchor="middle" x="422" y="768">300-second freshness</text>

  <rect class="node amber-node" x="817" y="676" width="260" height="112"/>
  <rect x="817" y="676" width="260" height="9" rx="5" fill="#f59e0b"/>
  <text class="service" text-anchor="middle" x="947" y="715">Kinesis Streaming Tables</text>
  <text class="resource" text-anchor="middle" x="947" y="743">upi-investigations-history</text>
  <text class="detail" text-anchor="middle" x="947" y="768">300-second freshness</text>

  <rect class="node neutral-node" x="585" y="676" width="200" height="112"/>
  <rect x="585" y="676" width="200" height="9" rx="5" fill="#64748b"/>
  <text class="service" text-anchor="middle" x="685" y="715">AWS Glue</text>
  <text class="resource" text-anchor="middle" x="685" y="743">JSON schemas</text>
  <text class="detail" text-anchor="middle" x="685" y="768">Date-time contracts</text>

  <path class="flow-amber async" d="M585 727 H564"/>
  <path class="flow-amber async" d="M785 727 H805"/>

  <rect class="node neutral-node" x="1122" y="676" width="250" height="112"/>
  <rect x="1122" y="676" width="250" height="9" rx="5" fill="#ef4444"/>
  <text class="service" text-anchor="middle" x="1247" y="715">Amazon S3 DLQ</text>
  <text class="resource" text-anchor="middle" x="1247" y="743">Failed delivery records</text>
  <text class="detail" text-anchor="middle" x="1247" y="768">Separate source prefixes</text>
  <path class="flow-amber async" d="M552 780 Q760 830 1110 746"/>
  <path class="flow-amber async" d="M1077 732 H1110"/>

  <!-- Historical destinations -->
  <rect class="node green-node" x="292" y="874" width="260" height="120"/>
  <rect x="292" y="874" width="260" height="9" rx="5" fill="#10b981"/>
  <text class="service" text-anchor="middle" x="422" y="913">Amazon S3 Tables</text>
  <text class="resource" text-anchor="middle" x="422" y="941">upi_demo.payment_events</text>
  <text class="detail" text-anchor="middle" x="422" y="966">Iceberg · hourly event_time</text>

  <rect class="node green-node" x="817" y="874" width="260" height="120"/>
  <rect x="817" y="874" width="260" height="9" rx="5" fill="#10b981"/>
  <text class="service" text-anchor="middle" x="947" y="913">Amazon S3 Tables</text>
  <text class="resource" text-anchor="middle" x="947" y="941">upi_demo.investigation_events</text>
  <text class="detail" text-anchor="middle" x="947" y="966">Iceberg · hourly detected_at</text>

  <path class="flow-green" d="M422 788 V862"/>
  <path class="flow-green" d="M947 788 V862"/>

  <rect class="node neutral-node" x="1122" y="874" width="250" height="120"/>
  <rect x="1122" y="874" width="250" height="9" rx="5" fill="#64748b"/>
  <text class="service" text-anchor="middle" x="1247" y="913">Amazon Athena</text>
  <text class="resource" text-anchor="middle" x="1247" y="941">Historical analytics</text>
  <text class="detail" text-anchor="middle" x="1247" y="966">Queries S3 Tables catalog</text>

  <path class="flow-green async" d="M422 994 V1024 H1247 V1006"/>
  <path class="flow-green async" d="M1077 934 H1110"/>

  <!-- Legend -->
  <circle cx="1442" cy="709" r="7" fill="#2563eb"/>
  <text class="detail" x="1457" y="714">Live</text>
  <circle cx="1442" cy="741" r="7" fill="#d97706"/>
  <text class="detail" x="1457" y="746">Async</text>
  <circle cx="1442" cy="773" r="7" fill="#059669"/>
  <text class="detail" x="1457" y="778">Data</text>
</svg>
